<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">lhg-idea — 个人收藏与想法库</title>
  <desc id="desc">lhg-idea skill 的存储后端：主库永远轻量，只有文字条目和配置；收藏的 GitHub 项目完整镜像放在货架库。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="14" fill="#FAFAF9"/>
  <rect x="1" y="1" width="1198" height="358" rx="14" fill="none" stroke="#E7E5E4" stroke-width="1.5"/>

  <g id="title-block">
    <rect x="64" y="62" width="12" height="12" fill="#0284C7"/>
    <text class="mono" x="86" y="74" font-size="17" letter-spacing="2" fill="#78716C">个人收藏库 · SKILL 存储后端</text>
    <text class="sans" x="64" y="152" font-size="72" font-weight="700" fill="#292524">收藏库</text>
    <text class="sans" x="64" y="196" font-size="26" font-weight="700" fill="#57534E">lhg-idea · 个人收藏与想法库</text>
    <text class="sans" x="64" y="238" font-size="21" fill="#292524">收藏链接、项目、博主，按需求检索自己的收藏。</text>
  </g>

  <line x1="700" y1="56" x2="700" y2="256" stroke="#E7E5E4" stroke-width="1.5"/>

  <g id="proof">
    <text class="sans" x="740" y="74" font-size="17" fill="#78716C">这个库现在的样子</text>
    <text class="mono" x="740" y="118" font-size="20" font-weight="700" fill="#0284C7">23 个</text>
    <text class="sans" x="802" y="118" font-size="22" font-weight="700" fill="#292524">正式条目 items/</text>
    <text class="mono" x="740" y="164" font-size="20" font-weight="700" fill="#0284C7">每周一 09:00</text>
    <text class="sans" x="875" y="164" font-size="22" font-weight="700" fill="#292524">上游更新检查</text>
    <text class="mono" x="740" y="210" font-size="20" font-weight="700" fill="#0284C7">轻量主库</text>
    <text class="sans" x="834" y="210" font-size="22" font-weight="700" fill="#292524">+ 镜像货架库</text>
  </g>

  <line x1="64" y1="288" x2="1136" y2="288" stroke="#E7E5E4" stroke-width="1.5"/>
  <g id="install">
    <text class="mono" x="64" y="327" font-size="16" fill="#78716C">取用</text>
    <text class="mono" x="140" y="327" font-size="20" font-weight="700" fill="#57534E">git clone https://github.com/lhg-skills/lhg-idea.git</text>
  </g>
</svg>
